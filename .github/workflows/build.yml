name: build-apk

on:
  push:
    branches: [main, can-lo]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Tạo khung Android và chép code native
        run: |
          flutter --version
          flutter create --platforms=android --org vn.wuan --project-name can_lo .
          rm -f test/widget_test.dart
          cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          K=android/app/src/main/kotlin/vn/wuan/can_lo
          mkdir -p "$K"
          rm -f "$K"/*.kt
          cp android_overrides/*.kt "$K/"
          cp -r android_overrides/res/. android/app/src/main/res/

      - name: Khoá ký cố định (để cài đè không mất dữ liệu)
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Dùng khoá ký từ secret"
          else
            cp android_overrides/debug.keystore ~/.android/debug.keystore
            echo "Dùng khoá ký trong repo"
          fi

      - name: Build APK
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee build.log
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a build.log
          flutter test 2>&1 | tee -a build.log
          flutter build apk --release --split-per-abi --build-name 1.0.${{ github.run_number }} --build-number ${{ github.run_number }} 2>&1 | tee -a build.log

      - name: Đẩy log lỗi lên nhánh ci-logs
        if: failure()
        run: |
          mkdir -p /tmp/logs && cp build.log /tmp/logs/ 2>/dev/null || echo "no log" > /tmp/logs/build.log
          cd /tmp/logs
          git init -q -b ci-logs
          git config user.name ci && git config user.email ci@local
          echo "run ${{ github.run_number }} sha ${{ github.sha }}" > info.txt
          git add -A && git commit -q -m "log run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs

      - name: Đăng bản phát hành
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          O=build/app/outputs/flutter-apk
          cp $O/app-arm64-v8a-release.apk CanLo.apk
          cp $O/app-armeabi-v7a-release.apk CanLo-armv7.apk
          cp $O/app-x86_64-release.apk CanLo-x86_64.apk
          TAG="v1.0.${{ github.run_number }}"
          FV=$(flutter --version | head -1)
          gh release create "$TAG" CanLo.apk CanLo-armv7.apk CanLo-x86_64.apk \
            --title "Cân Lỏ $TAG" \
            --notes "Tải **CanLo.apk** (đa số điện thoại đời mới). Máy rất cũ 32-bit thì lấy CanLo-armv7.apk. Build bằng $FV." \
            --latest
