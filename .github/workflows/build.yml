name: build-apk

on:
  push:
    branches: [main, can-lo]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Tạo khung Android và chép code native
        run: |
          flutter --version
          flutter create --platforms=android --org vn.wuan --project-name can_lo .
          rm -rf test
          cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          K=android/app/src/main/kotlin/vn/wuan/can_lo
          mkdir -p "$K"
          cp android_overrides/MainActivity.kt "$K/MainActivity.kt"
          cp android_overrides/Reminder.kt "$K/Reminder.kt"

      - name: Khoá ký cố định (để cài đè không mất dữ liệu)
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Dùng khoá ký từ secret"
          else
            cp android_overrides/debug.keystore ~/.android/debug.keystore
            echo "Dùng khoá ký trong repo"
          fi

      - name: Build APK
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee build.log
          flutter build apk --release 2>&1 | tee -a build.log

      - name: Đẩy log lỗi lên nhánh ci-logs
        if: failure()
        run: |
          mkdir -p /tmp/logs && cp build.log /tmp/logs/ 2>/dev/null || echo "no log" > /tmp/logs/build.log
          cd /tmp/logs
          git init -q -b ci-logs
          git config user.name ci && git config user.email ci@local
          echo "run ${{ github.run_number }} sha ${{ github.sha }}" > info.txt
          git add -A && git commit -q -m "log run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs

      - name: Đăng bản phát hành
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk CanLo.apk
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" CanLo.apk \
            --title "Cân Lỏ $TAG" \
            --notes "Tải CanLo.apk về điện thoại Android rồi mở để cài. Lần đầu Android sẽ hỏi cho phép cài app ngoài CH Play." \
            --latest
